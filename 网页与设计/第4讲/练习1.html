<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 600px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
       h2{
        color: #2e8b57;
        text-align: center;
       }
       .date{
        color: #8B4513;
        font-size: 16px;
        text-align: right;
       }
       .start{
        font-size: 18px;
        color: #4682b4;
       }
       .text{
        text-indent: 2em;
        color: #333333;
        font-size: 16px;
       }
        .end{
            font-size: 18px;
            color: #2f4f4f;
            text-align: right;
        }
        .flex{
            display: flex;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>亲爱的朋友：</h2>
        <p class="date">2025年9月24日</p>
        <p class="start">你好！</p>
        <div class="text">
            希望这封信能够找到你的，并且你一切安好。最近我一直在忙于我的工作和一些个人项目，也在思考我们之前谈论过的话题。
            我相信我们都在不断成长，面对新的挑战和机遇。希望未来能有更多的交流与合作。
        </div>
        <p class="end">祝你一切顺利，你的朋友</p>
    </div>
</body>
</html>
